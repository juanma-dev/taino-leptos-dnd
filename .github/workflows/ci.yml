name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same ref so a force-push doesn't keep a stale build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features --no-fail-fast

  msrv:
    name: MSRV (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-features

  wasm:
    name: wasm32 build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --target wasm32-unknown-unknown

  browser-tests:
    name: browser interaction tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          # wasm-pack drives `wasm-bindgen-test-runner` in a real headless
          # Chrome (already installed on ubuntu-latest), the only place the
          # synthetic-event tests in `tests/interactions.rs` will actually run
          # (Node has no DOM). Pinned chromedriver isn't needed — wasm-pack
          # downloads a matching one on first invocation.
          tool: wasm-pack
      # `wasm-pack test -p <crate>` doesn't work with virtual workspaces —
      # wasm-pack parses the root `Cargo.toml` first and bails with
      # `missing field 'package'`. Cd-ing into each crate sidesteps that.
      - name: Leptos browser tests (synthetic pointer + keyboard)
        working-directory: crates/taino-dnd-leptos
        run: wasm-pack test --chrome --headless
      - name: Dioxus browser tests (synthetic pointer + keyboard + smoke)
        working-directory: crates/taino-dnd-dioxus
        run: wasm-pack test --chrome --headless

  core-is-framework-free:
    name: core has no framework deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo tree must not list leptos/dioxus/yew under core
        run: |
          if cargo tree -p taino-dnd-core --edges normal | grep -E '^\s*(leptos|dioxus|yew)\b'; then
            echo "::error::taino-dnd-core depends on a UI framework. This is forbidden."
            exit 1
          fi

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `rustsec/audit-check@v2.0.0` needs `checks: write` (which the default
      # GITHUB_TOKEN no longer carries) and treats every advisory the same.
      # Running cargo-audit directly is simpler, lets us mirror the
      # `RUSTSEC-2024-0436` ignore from deny.toml (paste is unmaintained,
      # transitive from Leptos, no actionable fix on our side), and still
      # fails the job on any real vulnerability.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit --ignore RUSTSEC-2024-0436

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  size-budget:
    name: WASM size budget
    runs-on: ubuntu-latest
    env:
      # Initial budget for the gzipped, wasm-opt -Oz'd sortable-list example.
      # Bump with a note in the PR description if a justified increase happens.
      BUDGET_GZIP_KB: 400
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          # wasm-bindgen-cli version must match the wasm-bindgen crate in
          # Cargo.lock (currently 0.2.121). `binaryen` was dropped from
          # install-action's supported list — we install it via apt below.
          tool: wasm-bindgen-cli@0.2.121
      - name: Install binaryen (provides wasm-opt)
        run: sudo apt-get update && sudo apt-get install -y binaryen
      - run: bash scripts/size-check.sh

  docs:
    name: docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --all-features
