[package]
name = "taino-dnd-leptos"
description = "Accessible, pointer-events drag-and-drop primitives for Leptos."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords = ["drag-and-drop", "leptos", "wasm", "accessibility", "ui"]
categories = ["wasm", "web-programming", "gui"]
readme = "README.md"

[dependencies]
taino-dnd-core = { workspace = true }
leptos = { workspace = true }

# Pulled in only when building for the browser; the cfg below keeps native builds slim.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true, features = [
    "Document",
    "DomRect",
    "Element",
    "HtmlElement",
    "PointerEvent",
    "Window",
] }

[dev-dependencies]
wasm-bindgen-test = { workspace = true }

[lints]
workspace = true
