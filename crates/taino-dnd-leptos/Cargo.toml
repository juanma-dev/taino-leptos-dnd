[package]
name = "taino-dnd-leptos"
description = "Accessible, pointer-events drag-and-drop primitives for Leptos."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords = ["drag-and-drop", "leptos", "wasm", "accessibility", "ui"]
categories = ["wasm", "web-programming", "gui"]
readme = "README.md"

[dependencies]
taino-dnd-core = { workspace = true }
leptos = { workspace = true }
# web-sys / wasm-bindgen are type-only on native (no runtime), so we depend on
# them unconditionally to keep the public API uniform across targets.
wasm-bindgen = { workspace = true }
web-sys = { workspace = true, features = [
    "CssStyleDeclaration",
    "Document",
    "DomRect",
    "Element",
    "HtmlElement",
    "MediaQueryList",
    "PointerEvent",
    "Window",
] }

[dev-dependencies]
wasm-bindgen-test = { workspace = true }
# `gloo-timers` lets the interaction-test suite yield to the event loop
# after mount, so Leptos's `Effect::new`-scheduled droppable-registration
# work runs before we start dispatching synthetic events.
gloo-timers = { version = "0.3", features = ["futures"] }
# Extra web-sys features needed only by the browser interaction-test suite
# in `tests/interactions.rs` (constructing synthetic Pointer/Keyboard events
# and dispatching them through the EventTarget interface). Kept in
# dev-dependencies so the published crate's feature set stays slim.
web-sys = { workspace = true, features = [
    "Event",
    "EventInit",
    "EventTarget",
    "KeyboardEvent",
    "KeyboardEventInit",
    "MouseEventInit",
    "Node",
    "PointerEventInit",
    "UiEventInit",
] }

[lints]
workspace = true
