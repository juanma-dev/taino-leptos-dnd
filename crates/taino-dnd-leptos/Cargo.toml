[package]
name = "taino-dnd-leptos"
description = "Accessible, pointer-events drag-and-drop primitives for Leptos."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords = ["drag-and-drop", "leptos", "wasm", "accessibility", "ui"]
categories = ["wasm", "web-programming", "gui"]
readme = "README.md"

[dependencies]
taino-dnd-core = { workspace = true }
leptos = { workspace = true }
# web-sys / wasm-bindgen are type-only on native (no runtime), so we depend on
# them unconditionally to keep the public API uniform across targets.
wasm-bindgen = { workspace = true }
web-sys = { workspace = true, features = [
    "CssStyleDeclaration",
    "Document",
    "DomRect",
    "Element",
    "HtmlElement",
    "MediaQueryList",
    "PointerEvent",
    "Window",
] }

[dev-dependencies]
wasm-bindgen-test = { workspace = true }

[lints]
workspace = true
