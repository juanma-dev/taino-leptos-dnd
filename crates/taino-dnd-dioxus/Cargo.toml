[package]
name = "taino-dnd-dioxus"
description = "Accessible, pointer-events drag-and-drop primitives for Dioxus."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords = ["drag-and-drop", "dioxus", "wasm", "accessibility", "ui"]
categories = ["wasm", "web-programming", "gui"]
readme = "README.md"

[dependencies]
taino-dnd-core = { workspace = true }
dioxus = { workspace = true, features = ["html", "hooks", "macro", "signals"] }
# web-sys / wasm-bindgen are type-only on native (no runtime), so we depend
# unconditionally to keep the public API uniform across targets — mirrors
# the taino-dnd-leptos crate.
wasm-bindgen = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true, features = [
    "CssStyleDeclaration",
    "Document",
    "DomRect",
    "Element",
    "HtmlElement",
    "MediaQueryList",
    "PointerEvent",
    "Window",
] }

[dev-dependencies]
wasm-bindgen-test = { workspace = true }
# Extras only the browser interaction-test suite needs:
# - `dioxus` with the `web` feature for real DOM mounting + event listeners.
# - `gloo-timers` (futures feature) to yield to Dioxus's RAF-driven render
#   loop between dispatch and assert.
# - Extra web-sys features for synthetic `PointerEvent` / `KeyboardEvent`.
dioxus = { workspace = true, features = ["web", "html", "hooks", "macro", "signals"] }
dioxus-web = "0.6"
gloo-timers = { version = "0.3", features = ["futures"] }
web-sys = { workspace = true, features = [
    "Event",
    "EventInit",
    "EventTarget",
    "KeyboardEvent",
    "KeyboardEventInit",
    "MouseEventInit",
    "Node",
    "PointerEventInit",
    "UiEventInit",
] }

[lints]
workspace = true
