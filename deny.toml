[graph]
all-features = true

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = [
    # `paste` is unmaintained (creator archived the repo). It's still
    # pulled in transitively by Leptos's reactive_stores / tachys / etc.
    # No security issue, no actionable fix on our side. Re-evaluate when
    # we bump Leptos.
    "RUSTSEC-2024-0436",
    # `proc-macro-error2` is unmaintained (the fork itself is now archived,
    # as is its parent `proc-macro-error`). Pulled in transitively by
    # Leptos's `leptos_macro` via `rstml` → `syn_derive`. No security
    # issue, no fix on our side. Mirror to the `cargo audit --ignore` in
    # the CI workflow when bumping.
    "RUSTSEC-2026-0173",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",          # Boost Software License — used by xxhash-rust (server_fn)
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "Zlib",
    "MPL-2.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
